name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly against Kemal master. Its original purpose — noticing the HEAD-filter and
    # router-filter fixes described in docs/04-kemal-integration.md — was served when 1.13.0
    # shipped them. It stays, to catch the next regression in that area before a release does.
    - cron: "0 3 * * *"

# A push that supersedes a running build cancels it. Nothing here is a deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The main line, plus the measured floor and a point in between. Below 1.21 the
        # hashing executor cannot dispatch, so those jobs exercise the `allow_inline` branch —
        # which is most of the reason to run them at all.
        #
        # Kemal's version is not a matrix dimension because nothing here can pin it per job:
        # shard.lock decides it, and the two jobs below override it with a file instead.
        crystal: ["1.21.0", "1.14.0", "1.12.0"]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kemal_identity
          POSTGRES_PASSWORD: kemal_identity
          POSTGRES_DB: kemal_identity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      # shard.lock is committed, so this resolves exactly what was tested locally — which
      # matters here because ameba is pinned to a branch rather than a release.
      - name: Install dependencies
        run: shards install

      # Formatting and linting run on the main line only. `crystal tool format` changes its
      # output between releases, so checking it on an old compiler tests the compiler rather
      # than the code, and ameba needs a recent Crystal to build at all.
      - name: Format
        if: matrix.crystal == '1.21.0'
        run: crystal tool format --check

      # ameba runs from master: no ameba release compiles against Crystal 1.21
      # (`undefined method 'next_string_array_token' for Crystal::Lexer`). shard.lock pins the
      # commit, so this is reproducible despite tracking a branch.
      - name: Lint
        if: matrix.crystal == '1.21.0'
        run: shards build ameba && bin/ameba

      # docs/01-architecture.md: nothing outside src/kemal_identity/kemal may know that
      # HTTP::Server::Context exists, and that rule is what keeps spec/unit runnable without a
      # server. A stray reference from the core into the Kemal layer compiles perfectly well
      # when the whole shard is required, and fails here. It has caught one already —
      # blueprints/0009-csrf-token-scheme.md.
      - name: Core compiles without the Kemal adapter
        run: crystal build --no-codegen src/kemal_identity.cr

      # The testing tree is published API as of v0.8 (blueprints/0025, DEV-02), so a double that
      # has drifted from a contract must fail here rather than when a consumer requires it. The
      # suite exercises most of it, but not a double no spec happens to use.
      - name: The published testing entry points compile
        run: |
          crystal build --no-codegen src/kemal_identity/testing.cr
          crystal build --no-codegen src/kemal_identity/testing/contracts.cr

      # Every example under spec/unit and spec/security must pass with no DATABASE_URL.
      # Skipping a security regression because a database is missing defeats the point of
      # having it, so this step runs deliberately without one.
      # SQLite joins these: it needs no server, so it runs on every matrix entry rather than
      # only where a PostgreSQL service exists.
      - name: Specs that need no server
        run: crystal spec spec/unit spec/security spec/integration/sqlite_spec.cr

      - name: Migrate
        env:
          DATABASE_URL: postgres://kemal_identity:kemal_identity@localhost:5432/kemal_identity_test
        run: shards build migrate && bin/migrate up

      - name: Full suite
        env:
          DATABASE_URL: postgres://kemal_identity:kemal_identity@localhost:5432/kemal_identity_test
        run: crystal spec

      # An example that has drifted from the API is worse than no example, so this failing is
      # a CI failure rather than a warning.
      - name: Build the example
        run: crystal build --no-codegen examples/browser_session/app.cr

      # The benchmarks are not run here — docs/05-testing.md keeps them out of CI, since a
      # shared runner's numbers mean nothing. Compiling them still catches API drift, which it
      # did: v0.8.0 shipped with this step red because the testing tree moved and the benchmark's
      # requires did not follow.
      - name: Benchmarks compile
        run: crystal build --no-codegen bench/hashing_latency.cr

      # What a consumer actually resolves, which nothing else here checks.
      #
      # `Core compiles without the Kemal adapter` proves the core references no Kemal types, but
      # it compiles *inside this repository*, where both database drivers are installed as
      # development dependencies. It cannot notice `pg` moving back into `dependencies` — the
      # property v0.7.0 exists for. Measured from a consumer project in blueprints/0025 (OPS-07)
      # and found to hold, with nothing keeping it that way.
      #
      # Three projects, because the property is per-driver: a core-only consumer must resolve
      # neither, and each driver-specific one exactly its own.
      - name: A consumer resolves only the driver it asked for
        if: matrix.crystal == '1.21.0'
        run: |
          set -euo pipefail

          for kind in core sqlite pg; do
            work="$(mktemp -d)"
            cp -r tools/validation/ops07/"$kind"/. "$work"/

            # The example shard.yml points at a checkout path; here the shard is this tree.
            sed -i "s|path: .*|path: $GITHUB_WORKSPACE|" "$work"/shard.yml

            ( cd "$work" && shards install --quiet && crystal build --no-codegen src/main.cr )

            installed="$(ls "$work"/lib)"
            echo "$kind resolves: $(echo $installed | tr '\n' ' ')"

            case "$kind" in
              core)
                if echo "$installed" | grep -qE '^(pg|sqlite3)$'; then
                  echo "::error::a core-only consumer resolved a database driver"
                  exit 1
                fi
                ;;
              sqlite)
                echo "$installed" | grep -qx sqlite3 || { echo "::error::sqlite3 missing"; exit 1; }
                if echo "$installed" | grep -qx pg; then
                  echo "::error::a SQLite-only consumer resolved pg"
                  exit 1
                fi
                ;;
              pg)
                echo "$installed" | grep -qx pg || { echo "::error::pg missing"; exit 1; }
                if echo "$installed" | grep -qx sqlite3; then
                  echo "::error::a PostgreSQL-only consumer resolved sqlite3"
                  exit 1
                fi
                ;;
            esac

            # Development dependencies must not leak into a consumer either.
            for dev in ameba spec-kemal; do
              if echo "$installed" | grep -qx "$dev"; then
                echo "::error::$kind resolved the development dependency $dev"
                exit 1
              fi
            done
          done

  # The supported floor, run on every push. A floor recorded only in a comment is a floor that
  # quietly rises the first time somebody uses a newer Kemal API; this makes it a claim CI
  # checks. Measured 2026-08-25: 1.10.0 is the lowest that passes, and 1.9.0 fails to compile
  # because path-scoped `use` arrived in 1.10.0.
  kemal-floor:
    name: Kemal floor (1.10.0)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kemal_identity
          POSTGRES_PASSWORD: kemal_identity
          POSTGRES_DB: kemal_identity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      # shard.override.yml pins the dependency without touching shard.yml, so the constraint
      # consumers resolve stays exactly what is committed.
      - name: Pin Kemal to the floor
        run: |
          cat > shard.override.yml <<'YAML'
          dependencies:
            kemal:
              github: kemalcr/kemal
              version: 1.10.0
          YAML
          shards install

      # The QUERY route and its assertions compile only where Kemal has the verb, so this runs
      # two examples fewer than the main job rather than failing on a method that did not exist
      # yet. See spec/integration/kemal_spec.cr.
      - name: Full suite on the floor
        env:
          DATABASE_URL: postgres://kemal_identity:kemal_identity@localhost:5432/kemal_identity_test
        run: |
          shards build migrate
          bin/migrate up
          crystal spec

  kemal-master:
    name: Kemal master (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    # Advisory. Upstream master breaking is upstream's business until it is released; this job
    # exists to give us warning, not to block anything.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      # shard.override.yml is how shards repoints a dependency without touching shard.yml, so
      # the checked-in constraint stays exactly what consumers get.
      - name: Point Kemal at master
        run: |
          cat > shard.override.yml <<'YAML'
          dependencies:
            kemal:
              github: kemalcr/kemal
              branch: master
          YAML
          shards install
          crystal eval 'require "kemal"; puts "kemal #{Kemal::VERSION}"'

      # No database service here on purpose: these are the specs that would notice an upstream
      # change to filter or handler dispatch, and none of them needs one. The Kemal
      # integration specs are the reason this job exists — they are where HEAD and QUERY are
      # asserted to reach every guard.
      - name: Specs that would notice an upstream change
        run: crystal spec spec/unit spec/security spec/integration/kemal_spec.cr spec/integration/sqlite_spec.cr
