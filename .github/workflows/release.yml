name: Release

# A git tag and a GitHub release are two different objects, and pushing the first does not
# create the second. This is what closes that gap: `git push origin v0.6.0` publishes the
# release, with notes taken from CHANGELOG.md rather than retyped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify ${{ github.ref_name }} on Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest

    # The floor is a release gate, not only a CI job.
    #
    # v0.12.0 shipped a boot-time check that raised on every correct configuration below Crystal
    # 1.21: an array of classes is inferred as `Array(Kemal::Handler.class)` there, so a `===`
    # against it matched every handler. The suite caught it — on the 1.12.0 matrix entry, which
    # runs after the release workflow has already published. Verifying the tagged tree on one
    # version verifies it for one version.
    strategy:
      fail-fast: true
      matrix:
        crystal: ["1.21.0", "1.12.0"]

    # The commit that was verified, handed to `publish` so it can refuse a tag that has moved.
    outputs:
      sha: ${{ steps.pin.outputs.sha }}

    # The gate runs the PostgreSQL adapter, not only the database-free subset. v0.11.0 was
    # published with every MFA read raising against PostgreSQL, because the only job with a
    # database was CI's — which runs after this workflow has already published.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kemal_identity
          POSTGRES_PASSWORD: kemal_identity
          POSTGRES_DB: kemal_identity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # What is verified below is this checkout, and what is published is a tag. Say which commit
      # the two have in common, and stop if the checkout is not the commit the tag names.
      - name: Pin the tag to the commit being verified
        id: pin
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          head=$(git rev-parse HEAD)
          tagged=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          echo "HEAD=$head $GITHUB_REF_NAME=$tagged"
          if [ "$head" != "$tagged" ]; then
            echo "::error::checked out $head but $GITHUB_REF_NAME names $tagged"
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install

      # Formatting runs on the main line only, exactly as it does in CI: `crystal tool format`
      # changes its output between releases, so checking it on the floor tests the compiler
      # rather than the code — which is what the first attempt at this matrix did, reporting
      # every file in `src/` as unformatted.
      - name: Format
        if: matrix.crystal == '1.21.0'
        run: crystal tool format --check

      # Version agreement (tag, shard.yml, VERSION, CHANGELOG, README pin), the core and every
      # example building, and the **full** suite against the PostgreSQL service with nothing
      # pending. One script, so a maintainer runs exactly this before tagging.
      - name: Verify the tagged tree
        env:
          DATABASE_URL: postgres://kemal_identity:kemal_identity@localhost:5432/kemal_identity_test
        run: tools/release/verify.sh "$GITHUB_REF_NAME"

  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      # The tag can be moved, or deleted and recreated, between verification and here. Read
      # where it points *now* on the remote, and publish only if that is the commit verified.
      - name: The tag still names the verified commit
        env:
          VERIFIED: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          now=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          echo "verified=$VERIFIED $GITHUB_REF_NAME=$now"
          if [ -z "$VERIFIED" ] || [ "$now" != "$VERIFIED" ]; then
            echo "::error::$GITHUB_REF_NAME now names $now, not the verified $VERIFIED"
            exit 1
          fi

      # The section between this version's heading and the next one. Written once, in the
      # changelog, and read from there: release notes that are retyped are release notes that
      # drift from the changelog.
      - name: Extract the changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"

          awk -v v="$version" '
            $0 ~ "^## v" v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      # Idempotent, because a job that has already done the work should not fail on its last
      # line. Two ways this step used to be reached with the release already present: somebody
      # published it by hand before the workflow got there, and a re-run of this job. Both ended
      # in `HTTP 422: Release.tag_name already exists` after every check above had passed — a red
      # run with nothing actually wrong, which is the kind of red that teaches people to ignore
      # red.
      #
      # Updating rather than skipping is deliberate: the notes in CHANGELOG.md are the source, so
      # a release published by hand with something else in it gets corrected here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already exists; updating its notes from CHANGELOG.md"
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
