name: Release

# A git tag and a GitHub release are two different objects, and pushing the first does not
# create the second. This is what closes that gap: `git push origin v0.6.0` publishes the
# release, with notes taken from CHANGELOG.md rather than retyped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify ${{ github.ref_name }} on Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest

    # The floor is a release gate, not only a CI job.
    #
    # v0.12.0 shipped a boot-time check that raised on every correct configuration below Crystal
    # 1.21: an array of classes is inferred as `Array(Kemal::Handler.class)` there, so a `===`
    # against it matched every handler. The suite caught it — on the 1.12.0 matrix entry, which
    # runs after the release workflow has already published. Verifying the tagged tree on one
    # version verifies it for one version.
    strategy:
      fail-fast: true
      matrix:
        crystal: ["1.21.0", "1.12.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install

      # A tag saying v0.6.0 on a tree whose shard.yml still says 0.5.0 is a release nobody can
      # resolve correctly, and it is an easy mistake to make when the bump and the tag are two
      # commands. Cheap to check, painful to discover afterwards.
      - name: Check the tag matches the shard version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          shard=$(grep -E '^version:' shard.yml | awk '{print $2}')
          constant=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' src/kemal_identity/version.cr | tr -d '"')

          echo "tag=$tag shard.yml=$shard VERSION=$constant"

          if [ "$tag" != "$shard" ] || [ "$tag" != "$constant" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with shard.yml ($shard) or VERSION ($constant)"
            exit 1
          fi

      # Formatting runs on the main line only, exactly as it does in CI: `crystal tool format`
      # changes its output between releases, so checking it on the floor tests the compiler
      # rather than the code — which is what the first attempt at this matrix did, reporting
      # every file in `src/` as unformatted.
      - name: Format
        if: matrix.crystal == '1.21.0'
        run: crystal tool format --check

      # The full matrix already ran on this commit when it landed on main. This is the
      # database-free subset, re-run against the tag itself so a release is never cut from a
      # tree that does not build — the tag is what people will actually resolve.
      - name: Verify the tagged tree
        run: |
          set -e
          crystal build --no-codegen src/kemal_identity.cr
          # Globbed, like the CI job: a release cut from a tree where one of the examples no
          # longer compiles ships an example nobody can run.
          for app in examples/*/app.cr; do
            crystal build --no-codegen "$app"
          done
          crystal spec spec/unit spec/security spec/integration/sqlite_spec.cr

  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      # The section between this version's heading and the next one. Written once, in the
      # changelog, and read from there: release notes that are retyped are release notes that
      # drift from the changelog.
      - name: Extract the changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"

          awk -v v="$version" '
            $0 ~ "^## v" v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      # Idempotent, because a job that has already done the work should not fail on its last
      # line. Two ways this step used to be reached with the release already present: somebody
      # published it by hand before the workflow got there, and a re-run of this job. Both ended
      # in `HTTP 422: Release.tag_name already exists` after every check above had passed — a red
      # run with nothing actually wrong, which is the kind of red that teaches people to ignore
      # red.
      #
      # Updating rather than skipping is deliberate: the notes in CHANGELOG.md are the source, so
      # a release published by hand with something else in it gets corrected here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already exists; updating its notes from CHANGELOG.md"
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
