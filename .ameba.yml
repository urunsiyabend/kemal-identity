# Verified against the ameba pinned in shard.lock (1.7.0-dev). A rule name the installed
# ameba does not have is a hard error, so add rules here only after running `bin/ameba`.
#
# The bans in src/CLAUDE.md (no not_nil!, no bare Time.utc / Random::Secure, no puts, no
# blanket rescue) are enforced by spec/unit/source_hygiene_spec.cr rather than here, so
# they hold regardless of the ameba version.
Excluded:
  - lib/
  - bin/
  # Consumer-side validation attempts, kept as evidence for
  # blueprints/0025-maturity-validation-results.md. They belong to a separate project that
  # depends on this shard and are deliberately written the way an application would write
  # them -- `not_nil!` included -- so the bans in src/CLAUDE.md do not apply. One of them is
  # expected not to compile at all: that error is the finding. See tools/validation/README.md.
  - tools/validation/

Lint/SpecFilename:
  # The shared contracts and the test doubles moved to `src/kemal_identity/testing` in v0.8, so
  # that a consumer can reach them without touching this repository's spec tree
  # (blueprints/0025, DEV-02). They are not runnable spec files -- naming them `_spec.cr` would
  # have `crystal spec` collect files that define zero examples -- and they are not under
  # `spec/` any more either, so this exclusion now names where they live.
  Excluded:
    - src/kemal_identity/testing/**
