name: kemal_identity
version: 0.11.1

authors:
  - Siyabend Urun <urunsiyabend@gmail.com>

license: MIT

description: |
  Authentication for Crystal web applications — Kemal integration included.
  Server-side opaque sessions, password credentials, revocation.

# Measured, not guessed, as docs/00-scope.md requires. The *specs* pass down to Crystal 1.4,
# but a Kemal application does not: `Kemal.run` calls `Process.on_terminate`, which arrived in
# Crystal 1.12. The floor is therefore where a real application works, not where the test suite
# happens to compile — 1.12.0.
#
# Crystal 1.21 is still what you want if you can have it: `HashingExecutor` needs execution
# contexts, and below 1.21 it refuses to be built without an explicit `allow_inline: true`.
# A loud absence rather than a silent one; see blueprints/0013.
crystal: ">= 1.12.0"

dependencies:
  kemal:
    github: kemalcr/kemal
    # Also measured. The full suite passes on 1.10.0 through 1.13.0; 1.9.0 fails to compile
    # with `undefined method 'use' for top-level`, since path-scoped `use` arrived in 1.10.0.
    # CI runs the floor as its own job so this stays true.
    version: ">= 1.10.0, < 2.0"
  db:
    github: crystal-lang/crystal-db

development_dependencies:
  # The drivers are development dependencies, not dependencies. `pg` and `sqlite3` are needed
  # to *run this shard's own contract specs* against real databases; they are not needed to use
  # it. Nothing under `src/kemal_identity.cr` requires either — only `kemal_identity/postgres`
  # and `kemal_identity/sqlite` do, and an application that requires one of those declares that
  # driver itself, which it already had to for its own queries.
  #
  # Listing them here would make every consumer compile and link both drivers, including one
  # using neither because it implements the repository contracts over its own storage — which
  # is the arrangement `docs/03-data-model.md` treats as the normal one.
  pg:
    github: will/crystal-pg
  sqlite3:
    github: crystal-lang/crystal-sqlite3
  ameba:
    github: crystal-ameba/ameba
    # No released ameba supports Crystal 1.21: v1.6.4 fails to compile against it
    # (`undefined method 'next_string_array_token' for Crystal::Lexer`). master builds
    # clean. shard.lock pins the exact commit. Switch to `version: ~> 1.7` once v1.7.0
    # ships — v1.7.0-dev is tagged, so that is close.
    branch: master
  spec-kemal:
    github: kemalcr/spec-kemal

targets:
  ameba:
    main: lib/ameba/src/cli.cr
  migrate:
    # See blueprints/0002-no-micrate-dependency.md — micrate cannot resolve against this
    # stack, so this repository runs its own migration files.
    main: tools/migrate.cr
